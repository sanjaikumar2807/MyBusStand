<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Listing - MyBusStand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .route-info h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .route-path {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            font-size: 1.1rem;
        }

        .route-arrow {
            color: #667eea;
            font-weight: bold;
        }

        .back-btn {
            background: #f8f9fa;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filters {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        .bus-list {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .bus-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .bus-list-header h2 {
            color: #333;
            font-size: 1.5rem;
        }

        .sort-dropdown {
            padding: 0.5rem 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .bus-card {
            background: #f8f9fa;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .bus-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .bus-number {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .bus-type {
            background: #667eea;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .bus-route {
            color: #666;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .bus-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            font-size: 1rem;
        }

        .bus-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .track-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .track-btn:hover {
            transform: translateY(-2px);
        }

        .fare-info {
            text-align: right;
            flex: 1;
        }

        .fare-amount {
            font-size: 1.3rem;
            font-weight: bold;
            color: #27ae60;
        }

        .fare-label {
            color: #666;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        .no-buses {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .no-buses-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-on-time {
            background: #d4edda;
            color: #155724;
        }

        .status-delayed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-arriving {
            background: #d1ecf1;
            color: #0c5460;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .bus-header {
                flex-direction: column;
                gap: 0.5rem;
            }

            .bus-actions {
                flex-direction: column;
                width: 100%;
            }

            .track-btn {
                width: 100%;
            }

            .fare-info {
                text-align: left;
            }
        }

        /* ── Cookie Banner ── */
        #cookieBanner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 99999;
            padding: 1rem 1.5rem;
            background: rgba(15, 12, 40, 0.96);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(102, 126, 234, .35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
            transform: translateY(100%);
            transition: transform .45s cubic-bezier(.34, 1.56, .64, 1);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, .4)
        }

        #cookieBanner.show {
            transform: translateY(0)
        }

        #cookieBanner.hide {
            transform: translateY(110%);
            transition: transform .35s ease-in
        }

        .ck-icon {
            font-size: 1.8rem;
            flex-shrink: 0
        }

        .ck-text {
            flex: 1;
            min-width: 240px;
            color: #d0d0e8;
            font-size: .88rem;
            line-height: 1.6;
            margin: 0
        }

        .ck-text a {
            color: #a78bfa;
            text-decoration: underline;
            cursor: pointer
        }

        .ck-actions {
            display: flex;
            gap: .75rem;
            flex-shrink: 0;
            align-items: center
        }

        .ck-accept {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: .6rem 1.5rem;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: opacity .2s
        }

        .ck-accept:hover {
            opacity: .88
        }

        .ck-decline {
            background: transparent;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 25px;
            padding: .6rem 1.2rem;
            font-size: .85rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: all .2s
        }

        .ck-decline:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, .5)
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="route-info">
                <h1>Available Buses</h1>
                <div class="route-path">
                    <span id="fromLocation">Loading...</span>
                    <span class="route-arrow">&#x2192;</span>
                    <span id="toLocation">Loading...</span>
                </div>
            </div>
            <button class="back-btn" onclick="goBack()">&#x2190; Back to Search</button>
        </div>

        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="busType">Bus Type</label>
                    <select id="busType" onchange="filterBuses()">
                        <option value="">All Types</option>
                        <option value="AC">AC Bus</option>
                        <option value="Non-AC">Non-AC Bus</option>
                        <option value="Volvo">Volvo</option>
                        <option value="Express">Express</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="priceRange">Max Fare</label>
                    <select id="priceRange" onchange="filterBuses()">
                        <option value="">Any Price</option>
                        <option value="50">Under &#x20B9;50</option>
                        <option value="100">Under &#x20B9;100</option>
                        <option value="200">Under &#x20B9;200</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy" onchange="sortBuses()">
                        <option value="departure">Departure Time</option>
                        <option value="fare">Lowest Fare</option>
                        <option value="duration">Shortest Duration</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bus-list">
            <div class="bus-list-header">
                <h2 id="busCount">Loading buses...</h2>
                <select class="sort-dropdown" onchange="sortBuses()">
                    <option value="departure">Sort by Departure</option>
                    <option value="fare">Sort by Fare</option>
                    <option value="duration">Sort by Duration</option>
                </select>
            </div>

            <div id="busListContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Finding available buses...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let allBuses = [];
        let filteredBuses = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            loadSearchData();
            loadBuses();
        });

        function loadSearchData() {
            const searchData = JSON.parse(localStorage.getItem('searchData'));
            if (searchData) {
                document.getElementById('fromLocation').textContent = searchData.from;
                document.getElementById('toLocation').textContent = searchData.to;
            } else {
                // Default values if no search data
                document.getElementById('fromLocation').textContent = 'Melmaruvathur';
                document.getElementById('toLocation').textContent = 'Vandavasi';
            }
        }

        async function loadBuses() {
            const searchData = JSON.parse(localStorage.getItem('searchData'));

            try {
                let url;
                if (searchData && searchData.from && searchData.to) {
                    // Search for specific route via API
                    url = `${API_BASE}/routes/search/?from=${encodeURIComponent(searchData.from)}&to=${encodeURIComponent(searchData.to)}`;
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.buses && data.buses.length > 0) {
                        allBuses = data.buses.map(bus => ({
                            id: bus.id,
                            number: bus.number,
                            type: bus.bus_type,
                            route: bus.route_display,
                            departure: bus.departure,
                            arrival: bus.arrival,
                            duration: bus.duration,
                            fare: bus.fare,
                            status: bus.status,
                            availableSeats: bus.available_seats,
                            totalSeats: bus.total_seats,
                        }));
                    } else {
                        // No buses on this specific route — load all buses
                        await loadAllBuses();
                    }
                } else {
                    // No search data — load all buses
                    await loadAllBuses();
                }
            } catch (err) {
                console.error('Failed to load buses from API:', err);
                // Fallback: load all buses
                await loadAllBuses();
            }

            filteredBuses = [...allBuses];
            displayBuses();
        }

        async function loadAllBuses() {
            try {
                const response = await fetch(`${API_BASE}/buses/`);
                const data = await response.json();
                allBuses = data.map(bus => ({
                    id: bus.id,
                    number: bus.number,
                    type: bus.bus_type,
                    route: bus.route_display,
                    departure: bus.departure,
                    arrival: bus.arrival,
                    duration: bus.duration,
                    fare: bus.fare,
                    status: bus.status,
                    availableSeats: bus.available_seats,
                    totalSeats: bus.total_seats,
                }));
            } catch (err) {
                console.error('Failed to load all buses:', err);
                allBuses = [];
            }
        }

        function displayBuses() {
            const container = document.getElementById('busListContainer');
            const countElement = document.getElementById('busCount');

            if (filteredBuses.length === 0) {
                container.innerHTML = `
                    <div class="no-buses">
                        <div class="no-buses-icon">&#x1F68C;</div>
                        <h3>No buses found</h3>
                        <p>Try adjusting your filters or search for a different route</p>
                    </div>
                `;
                countElement.textContent = 'No buses available';
                return;
            }

            countElement.textContent = `${filteredBuses.length} buses available`;

            container.innerHTML = filteredBuses.map(bus => `
                <div class="bus-card">
                    <div class="bus-header">
                        <div>
                            <div class="bus-number">${bus.number}</div>
                            <div class="bus-route">${bus.route}</div>
                        </div>
                        <span class="bus-type">${bus.type}</span>
                    </div>
                    
                    <div class="bus-details">
                        <div class="detail-item">
                            <span class="detail-label">Departure</span>
                            <span class="detail-value">${bus.departure}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Arrival</span>
                            <span class="detail-value">${bus.arrival}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Duration</span>
                            <span class="detail-value">${bus.duration}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Seats Available</span>
                            <span class="detail-value">${bus.availableSeats}/${bus.totalSeats}</span>
                        </div>
                    </div>

                    <div class="bus-actions">
                        <button class="track-btn" onclick="trackBus(${bus.id})">
                            &#x1F4CD; Track Bus
                        </button>
                        <div class="fare-info">
                            <div class="fare-amount">&#x20B9;${bus.fare}</div>
                            <div class="fare-label">per person</div>
                        </div>
                        <span class="status-badge status-${bus.status}">
                            ${bus.status.replace('-', ' ').toUpperCase()}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function filterBuses() {
            const busType = document.getElementById('busType').value;
            const priceRange = document.getElementById('priceRange').value;

            filteredBuses = allBuses.filter(bus => {
                const typeMatch = !busType || bus.type.toLowerCase().includes(busType.toLowerCase());
                const priceMatch = !priceRange || bus.fare <= parseInt(priceRange);
                return typeMatch && priceMatch;
            });

            displayBuses();
        }

        function sortBuses() {
            const sortBy = document.getElementById('sortBy').value;

            filteredBuses.sort((a, b) => {
                switch (sortBy) {
                    case 'fare':
                        return a.fare - b.fare;
                    case 'duration':
                        return parseDuration(a.duration) - parseDuration(b.duration);
                    case 'departure':
                    default:
                        return compareTime(a.departure, b.departure);
                }
            });

            displayBuses();
        }

        function parseDuration(duration) {
            const parts = duration.match(/(\d+)h\s*(\d+)m/);
            if (parts) {
                return parseInt(parts[1]) * 60 + parseInt(parts[2]);
            }
            return 0;
        }

        function compareTime(time1, time2) {
            const t1 = new Date('2000-01-01 ' + time1);
            const t2 = new Date('2000-01-01 ' + time2);
            return t1 - t2;
        }

        function trackBus(busId) {
            const bus = allBuses.find(b => b.id === busId);
            if (bus) {
                // Store selected bus data for tracking page
                localStorage.setItem('selectedBus', JSON.stringify(bus));
                localStorage.setItem('selectedBusId', busId);
                window.location.href = 'live bus tracking module.html';
            }
        }

        function goBack() {
            window.location.href = 'route search module.html';
        }

        // Check if user is logged in
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'user authentication module.html';
        }

        // ── Cookie Consent ────────────────────────────────────────────────────
        (function () {
            function needsBanner(){try{var d=JSON.parse(localStorage.getItem('mbs_ck')||'null');if(!d)return true;return(Date.now()-d.ts)>180*86400000;}catch(e){return true;}}
            if(needsBanner()) setTimeout(() => document.getElementById('cookieBanner').classList.add('show'), 800);
        })();
        function acceptCookies() { localStorage.setItem('mbs_ck', JSON.stringify({choice:'accepted',ts:Date.now()})); _ckDismiss(); }
        function declineCookies() { localStorage.setItem('mbs_ck', JSON.stringify({choice:'declined',ts:Date.now()})); _ckDismiss(); }
        function _ckDismiss() { const b = document.getElementById('cookieBanner'); b.classList.remove('show'); b.classList.add('hide'); setTimeout(() => b.style.display = 'none', 400); }
    </script>

    <!-- Cookie Consent Banner -->
    <div id="cookieBanner" role="dialog" aria-label="Cookie consent">
        <div class="ck-icon">🍪</div>
        <p class="ck-text">We use cookies to enhance your browsing experience, provide personalized content, and analyze
            our traffic. By clicking <strong style="color:#fff">Accept</strong>, you consent to our use of cookies. <a
                onclick="alert('Privacy Policy coming soon!')">Learn more</a></p>
        <div class="ck-actions">
            <button class="ck-decline" onclick="declineCookies()">Decline</button>
            <button class="ck-accept" id="cookieAcceptBtn" onclick="acceptCookies()">Accept 🎉</button>
        </div>
    </div>
</body>

</html>
